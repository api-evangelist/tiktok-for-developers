aid: tiktok-for-developers
name: TikTok for Developers
description: TikTok for Developers provides a suite of REST APIs enabling third-party
  platforms to integrate with TikTok's social video ecosystem. Products include Login
  Kit, Display API, Content Posting API, Research API, and the TikTok API for Business,
  supporting use cases from user authentication and video publishing to advertising
  campaign management and academic research.
