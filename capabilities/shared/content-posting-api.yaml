naftiko: "1.0.0-alpha1"

info:
  label: "TikTok Content Posting API"
  description: >-
    Publish videos directly to a user's TikTok account from third-party
    platforms. Supports file upload, URL pull, inbox drafts, and publish
    status monitoring.
  tags:
    - TikTok
    - Content Posting
    - Publishing
    - Social Media
    - Video
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TIKTOK_ACCESS_TOKEN: TIKTOK_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: tiktok-posting
      baseUri: https://open.tiktokapis.com
      description: "TikTok Content Posting API for publishing video content"
      authentication:
        type: bearer
        token: "{{TIKTOK_ACCESS_TOKEN}}"
      resources:
        - name: post
          path: /v2/post/publish
          description: "Video publish operations"
          operations:
            - name: init-video-publish
              method: POST
              description: "Initiate a video upload or direct post to TikTok"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  source_info:
                    source: "{{tools.source}}"
                    video_url: "{{tools.video_url}}"
                    chunk_size: "{{tools.chunk_size}}"
                    total_chunk_count: "{{tools.total_chunk_count}}"
                  post_info:
                    title: "{{tools.title}}"
                    privacy_level: "{{tools.privacy_level}}"
                    disable_duet: "{{tools.disable_duet}}"
                    disable_comment: "{{tools.disable_comment}}"
                    disable_stitch: "{{tools.disable_stitch}}"
            - name: get-publish-status
              method: POST
              description: "Poll the status of a video publish job"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  publish_id: "{{tools.publish_id}}"
            - name: query-creator-info
              method: POST
              description: "Retrieve creator content posting settings"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: tiktok-posting-rest
      resources:
        - path: /v1/posts/init
          name: post-init
          description: "Initiate a video post"
          operations:
            - method: POST
              name: init-video-publish
              description: "Initiate a TikTok video upload or direct post"
              call: "tiktok-posting.init-video-publish"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/posts/status
          name: post-status
          description: "Check publish status"
          operations:
            - method: POST
              name: get-publish-status
              description: "Get the current status of a video publish job"
              call: "tiktok-posting.get-publish-status"
              with:
                publish_id: "rest.publish_id"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/posts/creator-info
          name: creator-info
          description: "Creator posting configuration"
          operations:
            - method: GET
              name: query-creator-info
              description: "Get creator's content posting settings"
              call: "tiktok-posting.query-creator-info"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: tiktok-posting-mcp
      transport: http
      tools:
        - name: init-video-publish
          description: "Initiate a TikTok video upload or direct post"
          hints:
            readOnly: false
            destructive: false
          call: "tiktok-posting.init-video-publish"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-publish-status
          description: "Check the status of a TikTok video publish job"
          hints:
            readOnly: true
            idempotent: true
          call: "tiktok-posting.get-publish-status"
          with:
            publish_id: "tools.publish_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: query-creator-info
          description: "Get creator's TikTok content posting settings and permissions"
          hints:
            readOnly: true
            idempotent: true
          call: "tiktok-posting.query-creator-info"
          outputParameters:
            - type: object
              mapping: "$."
