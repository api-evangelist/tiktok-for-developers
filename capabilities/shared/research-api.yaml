naftiko: "1.0.0-alpha1"

info:
  label: "TikTok Research API"
  description: >-
    Access TikTok public data for academic and institutional research.
    Supports querying videos, user information, comments, followers,
    following lists, liked videos, pinned videos, and reposted videos.
  tags:
    - TikTok
    - Research
    - Analytics
    - Social Media
    - Video
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TIKTOK_RESEARCH_ACCESS_TOKEN: TIKTOK_RESEARCH_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: tiktok-research
      baseUri: https://open.tiktokapis.com
      description: "TikTok Research API for academic data access"
      authentication:
        type: bearer
        token: "{{TIKTOK_RESEARCH_ACCESS_TOKEN}}"
      resources:
        - name: research-videos
          path: /v2/research/video
          description: "Research video data"
          operations:
            - name: query-research-videos
              method: POST
              description: "Query TikTok videos using boolean filters"
              inputParameters:
                - name: fields
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  query: "{{tools.query}}"
                  start_date: "{{tools.start_date}}"
                  end_date: "{{tools.end_date}}"
                  max_count: "{{tools.max_count}}"
                  cursor: "{{tools.cursor}}"
            - name: list-video-comments
              method: POST
              description: "Retrieve all comments on a specific video"
              inputParameters:
                - name: fields
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  video_id: "{{tools.video_id}}"
                  max_count: "{{tools.max_count}}"
            - name: list-user-liked-videos
              method: POST
              description: "Retrieve videos liked by a user"
              inputParameters:
                - name: fields
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  username: "{{tools.username}}"
                  max_count: "{{tools.max_count}}"
            - name: list-user-pinned-videos
              method: POST
              description: "Retrieve videos pinned by a user"
              inputParameters:
                - name: fields
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  username: "{{tools.username}}"
                  max_count: "{{tools.max_count}}"
            - name: list-user-reposted-videos
              method: POST
              description: "Retrieve videos reposted by a user"
              inputParameters:
                - name: fields
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  username: "{{tools.username}}"
                  max_count: "{{tools.max_count}}"
        - name: research-users
          path: /v2/research/user
          description: "Research user data"
          operations:
            - name: query-research-user-info
              method: POST
              description: "Retrieve public TikTok account information by handle"
              inputParameters:
                - name: fields
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  username: "{{tools.username}}"
            - name: list-user-followers
              method: POST
              description: "Retrieve follower list for a user"
              inputParameters:
                - name: fields
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  username: "{{tools.username}}"
                  max_count: "{{tools.max_count}}"
            - name: list-user-following
              method: POST
              description: "Retrieve following list for a user"
              inputParameters:
                - name: fields
                  in: query
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  username: "{{tools.username}}"
                  max_count: "{{tools.max_count}}"

  exposes:
    - type: rest
      port: 8102
      namespace: tiktok-research-rest
      resources:
        - path: /v1/research/videos
          name: research-videos
          description: "Research video queries"
          operations:
            - method: POST
              name: query-research-videos
              description: "Query TikTok videos for research"
              call: "tiktok-research.query-research-videos"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/research/users/{username}
          name: research-users
          description: "Research user information"
          operations:
            - method: GET
              name: query-research-user-info
              description: "Get public user information for research"
              call: "tiktok-research.query-research-user-info"
              with:
                username: "rest.username"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/research/videos/{video_id}/comments
          name: video-comments
          description: "Video comment research data"
          operations:
            - method: GET
              name: list-video-comments
              description: "List all comments on a video"
              call: "tiktok-research.list-video-comments"
              with:
                video_id: "rest.video_id"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/research/users/{username}/followers
          name: user-followers
          description: "User follower research data"
          operations:
            - method: GET
              name: list-user-followers
              description: "List user followers for research"
              call: "tiktok-research.list-user-followers"
              with:
                username: "rest.username"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/research/users/{username}/following
          name: user-following
          description: "User following research data"
          operations:
            - method: GET
              name: list-user-following
              description: "List accounts a user follows"
              call: "tiktok-research.list-user-following"
              with:
                username: "rest.username"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9102
      namespace: tiktok-research-mcp
      transport: http
      tools:
        - name: query-research-videos
          description: "Query TikTok public videos using boolean filters for research"
          hints:
            readOnly: true
            idempotent: true
          call: "tiktok-research.query-research-videos"
          outputParameters:
            - type: object
              mapping: "$."
        - name: query-research-user-info
          description: "Get public TikTok account information by username"
          hints:
            readOnly: true
            idempotent: true
          call: "tiktok-research.query-research-user-info"
          with:
            username: "tools.username"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-video-comments
          description: "Retrieve all comments on a TikTok video"
          hints:
            readOnly: true
            idempotent: true
          call: "tiktok-research.list-video-comments"
          with:
            video_id: "tools.video_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-user-followers
          description: "List followers of a TikTok user for research"
          hints:
            readOnly: true
            idempotent: true
          call: "tiktok-research.list-user-followers"
          with:
            username: "tools.username"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-user-following
          description: "List accounts a TikTok user follows"
          hints:
            readOnly: true
            idempotent: true
          call: "tiktok-research.list-user-following"
          with:
            username: "tools.username"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-user-liked-videos
          description: "List videos liked by a TikTok user"
          hints:
            readOnly: true
            idempotent: true
          call: "tiktok-research.list-user-liked-videos"
          with:
            username: "tools.username"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-user-pinned-videos
          description: "List videos pinned by a TikTok user"
          hints:
            readOnly: true
            idempotent: true
          call: "tiktok-research.list-user-pinned-videos"
          with:
            username: "tools.username"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-user-reposted-videos
          description: "List videos reposted by a TikTok user"
          hints:
            readOnly: true
            idempotent: true
          call: "tiktok-research.list-user-reposted-videos"
          with:
            username: "tools.username"
          outputParameters:
            - type: object
              mapping: "$."
