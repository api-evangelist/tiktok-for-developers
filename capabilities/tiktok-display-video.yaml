naftiko: 1.0.0-alpha2
info:
  label: TikTok Display API — Video
  description: 'TikTok Display API — Video. 2 operations. Lead operation: List Videos. Self-contained Naftiko capability covering
    one Tiktok For Developers business surface.'
  tags:
  - Tiktok For Developers
  - Video
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TIKTOK_FOR_DEVELOPERS_API_KEY: TIKTOK_FOR_DEVELOPERS_API_KEY
capability:
  consumes:
  - type: http
    namespace: tiktok-display-video
    baseUri: https://open.tiktokapis.com
    description: TikTok Display API — Video business capability. Self-contained, no shared references.
    resources:
    - name: v2-video-list
      path: /v2/video/list/
      operations:
      - name: listvideos
        method: POST
        description: List Videos
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fields
          in: query
          type: string
          description: Comma-separated list of fields to return (e.g. id,create_time,cover_image_url,share_url,video_description,duration,height,width,title,embed_html,embed_link,like
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: v2-video-query
      path: /v2/video/query/
      operations:
      - name: queryvideos
        method: POST
        description: Query Videos
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fields
          in: query
          type: string
          description: Comma-separated list of fields to return
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TIKTOK_FOR_DEVELOPERS_API_KEY}}'
  exposes:
  - type: rest
    namespace: tiktok-display-video-rest
    port: 8080
    description: REST adapter for TikTok Display API — Video. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v2/video/list
      name: v2-video-list
      description: REST surface for v2-video-list.
      operations:
      - method: POST
        name: listvideos
        description: List Videos
        call: tiktok-display-video.listvideos
        with:
          fields: rest.fields
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/video/query
      name: v2-video-query
      description: REST surface for v2-video-query.
      operations:
      - method: POST
        name: queryvideos
        description: Query Videos
        call: tiktok-display-video.queryvideos
        with:
          fields: rest.fields
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tiktok-display-video-mcp
    port: 9090
    transport: http
    description: MCP adapter for TikTok Display API — Video. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-videos
      description: List Videos
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: tiktok-display-video.listvideos
      with:
        fields: tools.fields
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: query-videos
      description: Query Videos
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: tiktok-display-video.queryvideos
      with:
        fields: tools.fields
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
