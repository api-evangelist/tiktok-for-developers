specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: TikTok for Developers
providerId: tiktok-for-developers
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Social
  - Video
  - Rate Limiting
description: The TikTok for Developers v2 server APIs publish a default 600 requests-per-minute sliding
  window per documented endpoint (user info, video query, video list). Throttled responses return HTTP
  429 with error code rate_limit_exceeded; quota increases are reviewed via the Support Page.
sources:
  - https://developers.tiktok.com/doc/tiktok-api-v2-rate-limit
responseCodes:
  throttled: 429
limits:
  - name: /v2/user/info/
    scope: client
    metric: requests_per_minute
    limit: 600
    timeFrame: minute
    notes: One-minute sliding window.
  - name: /v2/video/query/
    scope: client
    metric: requests_per_minute
    limit: 600
    timeFrame: minute
    notes: One-minute sliding window.
  - name: /v2/video/list/
    scope: client
    metric: requests_per_minute
    limit: 600
    timeFrame: minute
    notes: One-minute sliding window.
policies:
  - name: Sliding Window
    description: Rate-limit calculation uses a one-minute sliding window per documented endpoint.
  - name: Quota Increase
    description: Apps needing higher limits submit a request via the TikTok developer Support Page; TikTok
      reviews and may approve a raised cap.
  - name: Throttling Response
    description: When the limit is exceeded the API returns HTTP 429 with error code rate_limit_exceeded.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
