specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: TikTok for Developers
providerId: tiktok-for-developers
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Social
  - Video
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps for the TikTok for Developers platform: free, approval-gated access
  with no per-call billing. FinOps focus is on quota burn against the published 600 rpm limits and approval-tier
  entitlements.'
sources:
  - https://developers.tiktok.com/products
  - https://developers.tiktok.com/doc/tiktok-api-v2-rate-limit
  - https://focus.finops.org/focus-specification/v1-3/
notes: TikTok does not bill developers per call; there is no usage-based invoice surface. FinOps observability
  is internal telemetry against the documented 600 rpm sliding window per endpoint.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: TikTok Pte. Ltd.
serviceCategory: Social Platform APIs
billingModel:
  pricingCategory: Free / Approval-Gated
  billingFrequency: N/A
  billingCurrency: USD
  chargeCategories:
    - Usage
focusColumns:
  ServiceName: TikTok for Developers
  ServiceCategory: Social Platform APIs
  ProviderName: TikTok
  PublisherName: TikTok Pte. Ltd.
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: user_info_requests
    unit: request
    aggregation: sum
    dimensions:
      - client_key
      - endpoint
  - name: video_query_requests
    unit: request
    aggregation: sum
    dimensions:
      - client_key
      - endpoint
  - name: video_list_requests
    unit: request
    aggregation: sum
    dimensions:
      - client_key
      - endpoint
principles:
  - name: Visibility
    description: Track per-client_key request volume against the 600 rpm sliding window for the documented
      v2 endpoints to anticipate 429 throttling.
  - name: Allocation
    description: Issue a distinct client key per app and environment so quota and approval-tier entitlements
      can be attributed to the consuming product team.
  - name: Optimization
    description: Cache user_info responses, batch video queries, and avoid redundant list polls before
      requesting a quota raise via TikTok Support.
  - name: Accountability
    description: Designate a developer-relations owner accountable for app review status, approval-tier
      renewal, and Support tickets for limit increases.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
