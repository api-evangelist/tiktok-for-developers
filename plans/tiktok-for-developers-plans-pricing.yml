specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: TikTok for Developers
providerId: tiktok-for-developers
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Social
  - Video
  - Login
  - Sharing
description: TikTok for Developers exposes Login Kit, Share Kit, Embed Videos, Content Posting API, Display
  API, and Webhooks to any registered developer at no published price. Research Tools and Commercial
  Content API require approval; the Data Portability API is restricted to TikTok users in the EEA and
  UK. There is no per-call rate card.
sources:
  - https://developers.tiktok.com/products
  - https://developers.tiktok.com/doc/getting-started-create-an-app
notes: TikTok for Developers does not publish pricing. Plans capture the approval and audience tiers
  rather than billing tiers.
plans:
  - id: tiktok-for-developers-developer
    name: Developer (Default)
    type: freemium
    description: Default access to the open developer products for any registered TikTok app.
    entries:
      - label: Default Access
        name: default_access
        type: flat
        metric: usage
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0'
        userMultiplied: false
    elements:
      - name: Login Kit
      - name: Share Kit
      - name: Embed Videos
      - name: Content Posting API
      - name: Display API
      - name: Webhooks
      - name: Green Screen Kit
  - id: tiktok-for-developers-research
    name: Research Tools
    type: enterprise
    description: Available only to approved researchers.
    entries:
      - label: Approved-Researcher Access
        name: approved_researcher_access
        type: flat
        metric: usage
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: 'approval-gated'
        userMultiplied: false
    elements:
      - name: Available only to approved researchers
  - id: tiktok-for-developers-commercial-content
    name: Commercial Content API
    type: enterprise
    description: Approval-gated access to commercial-content data and tooling.
    entries:
      - label: Approval-Gated Access
        name: approval_gated_access
        type: flat
        metric: usage
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: 'approval-gated'
        userMultiplied: false
    elements:
      - name: Approval required
  - id: tiktok-for-developers-data-portability
    name: Data Portability API
    type: enterprise
    description: Limited to TikTok users in the EEA and UK.
    entries:
      - label: EEA / UK Access
        name: eea_uk_access
        type: flat
        metric: usage
        limit: -1
        timeFrame: usage
        geo: 'EEA, UK'
        unit: 1
        price: '0'
        userMultiplied: false
    elements:
      - name: EEA and UK users only
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
